name: Bot Señales WTI

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WTI_SYMBOL: ${{ secrets.WTI_SYMBOL }}
          WTI_INTERVAL: ${{ secrets.WTI_INTERVAL }}
          WTI_PERIOD: ${{ secrets.WTI_PERIOD }}
          FAST_EMA: ${{ secrets.FAST_EMA }}
          SLOW_EMA: ${{ secrets.SLOW_EMA }}
          TREND_EMA: ${{ secrets.TREND_EMA }}
          RSI_PERIOD: ${{ secrets.RSI_PERIOD }}
          ATR_PERIOD: ${{ secrets.ATR_PERIOD }}
          ATR_STOP_MULT: ${{ secrets.ATR_STOP_MULT }}
          RR_MULT: ${{ secrets.RR_MULT }}
          ALERT_MODE: ${{ secrets.ALERT_MODE }}
        run: python main.py
